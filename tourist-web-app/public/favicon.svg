<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="forestGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#065f46" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="6" stdDeviation="6" flood-opacity="0.3" />
    </filter>
  </defs>
  <!-- Background Circle with organic border/gradient -->
  <circle cx="256" cy="256" r="230" fill="url(#forestGrad)" filter="url(#shadow)" />
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-width="8" stroke-dasharray="15 10" opacity="0.3" />
  
  <!-- Inner ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.5" />
  
  <!-- Compass Needle (North-South pointer styled like a leaf) -->
  <!-- North pointer (Emerald/White) -->
  <path d="M256 90 L290 256 L256 230 Z" fill="#ffffff" />
  <path d="M256 90 L222 256 L256 230 Z" fill="#a7f3d0" />
  
  <!-- South pointer (Darker/Contrast) -->
  <path d="M256 422 L290 256 L256 282 Z" fill="#047857" />
  <path d="M256 422 L222 256 L256 282 Z" fill="#065f46" />

  <!-- Center Pivot Pin -->
  <circle cx="256" cy="256" r="16" fill="#ffffff" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="8" fill="#10b981" />

  <!-- Direction letters (North, South, East, West) -->
  <text x="256" y="70" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle">N</text>
  <text x="256" y="462" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.7">S</text>
  <text x="442" y="266" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.7">E</text>
  <text x="70" y="266" font-family="'Outfit', 'Inter', sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" opacity="0.7">W</text>
</svg>